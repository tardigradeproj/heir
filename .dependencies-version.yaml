# Single source of truth for the versions of external dependencies that
# Makefile.distro downloads for worker nodes and the tenant control plane.
#
# Bump a version here, not in Makefile.distro. Each key is read via yq by
# Makefile.distro and can still be overridden per-invocation, e.g.:
#   make download-worker-artifacts KUBE_VERSION=v1.36.0
kubernetes: v1.36.5
containerd: 2.4.1
runc: v1.5.2
crictl: v1.36.0
cni: v1.9.1
calico: 3.33.0
helm: v3.22.0
coredns-chart: 1.48.2
flannel-chart: v0.28.10
