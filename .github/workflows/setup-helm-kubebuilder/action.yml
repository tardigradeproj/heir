name: Setup Helm and kubebuilder
description: >
  Installs Helm and kubebuilder, needed to generate (make helm) and package
  the Helm chart. 

runs:
  using: composite
  steps:
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.19.0

    - name: Install kubebuilder
      shell: bash
      run: |
        curl -L -o kubebuilder "https://go.kubebuilder.io/dl/latest/$(go env GOOS)/$(go env GOARCH)"
        chmod +x kubebuilder && sudo mv kubebuilder /usr/local/bin/

