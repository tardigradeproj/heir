name: Build and Release
on:
  pull_request:
  push:
    tags:
      - 'v*' # Triggers only on semantic version tags (e.g., v2.0.0)

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: GoReleaser Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 #  full history to generate the changelog

      - name: Setup build toolchain
        uses: ./.github/workflows/setup-toolchain

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry (Helm OCI)
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run GoReleaser (Dry-Run Snapshot for PRs)
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean

      - name: Run GoReleaser (Publish Production Release)
        if: github.event_name != 'pull_request'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push Helm chart
        if: github.event_name != 'pull_request'
        env:
          IMG: ghcr.io/tardigradeproj/heir-controller-manager:${{ github.ref_name }}
          CHART_VERSION: ${{ github.ref_name }}
        run: |
          make helm IMG="$IMG"
          mkdir -p dist/chart-out
          helm package dist/chart -d dist/chart-out \
            --version "${CHART_VERSION#v}" \
            --app-version "${CHART_VERSION#v}"
          helm push dist/chart-out/heir-*.tgz oci://ghcr.io/tardigradeproj/charts