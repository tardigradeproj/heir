apiVersion: clusteragent.tardigrade.runtime.io/v1alpha1
kind: HelmChart
metadata:
  name: podinfo
  namespace: default
spec:
  chart:
    name: podinfo
    repo: https://stefanprodan.github.io/podinfo
    targetNamespace: default
    createNamespace: true
    version: "6.15.0"
  helm:
    version: v3
    backOffLimit: 3
    timeout: 120s
    atomic: true
  runtime:
    image: kind-registry:5000/helmer:latest
    bootstrap: true
  values:
    content: |
      replicaCount: 4
#    set:
#      replicaCount: "2"
