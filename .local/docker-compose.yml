# Usage:
#   docker compose -f .local/docker-compose.yml up -d
#   docker exec -it dev-worker0 bash     # no SSH keys needed, unlike `vagrant ssh`
#   docker compose -f .local/docker-compose.yml down -v   # -v also drops the containerd volumes

name: heir-dev

x-worker: &worker
  image: quay.io/k0sproject/bootloose-ubuntu24.04
  command: ["/sbin/init"]
  stop_signal: SIGRTMIN+3
  privileged: true
  cgroup: host
  cgroup_parent: bootloose.slice
  tmpfs:
    - /run
    - /run/lock
    - /tmp:exec,mode=777

services:
  worker0:
    <<: *worker
    container_name: dev-worker0
    hostname: worker0
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${HEIR_BINARY:-../dist/distro_linux_arm64_v8.0/heir}:/usr/local/bin/heir
      - worker0-var-lib-heir:/var/lib/heir
      - /usr/lib/modules:/usr/lib/modules:ro
      - /lib/modules:/lib/modules:ro
    ports:
      - "2200:22"
    networks:
      kind:
        aliases: [worker0]

  worker1:
    <<: *worker
    container_name: dev-worker1
    hostname: worker1
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${HEIR_BINARY:-../dist/distro_linux_arm64_v8.0/heir}:/usr/local/bin/heir
      - worker1-var-lib-heir:/var/lib/heir
      - /usr/lib/modules:/usr/lib/modules:ro
      - /lib/modules:/lib/modules:ro
    ports:
      - "2201:22"
    networks:
      kind:
        aliases: [worker1]

volumes:
  worker0-var-lib-heir:
  worker1-var-lib-heir:

networks:
  kind:
    external: true
