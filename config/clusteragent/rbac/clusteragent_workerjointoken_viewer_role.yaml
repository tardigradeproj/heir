# This rule is not used by the project heir itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to clusteragent.tardigrade.runtime.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: heir
    app.kubernetes.io/managed-by: kustomize
  name: clusteragent-workerjointoken-viewer-role
rules:
- apiGroups:
  - clusteragent.tardigrade.runtime.io
  resources:
  - workerjointokens
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - clusteragent.tardigrade.runtime.io
  resources:
  - workerjointokens/status
  verbs:
  - get
