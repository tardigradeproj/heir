project_name: tardigrade
version: 2


before:
  hooks:
    - go mod tidy
    - make download-all-artifacts ARCH=amd64
    - make download-all-artifacts ARCH=arm64
    - make compress-worker-artifacts ARCH=amd64
    - make compress-worker-artifacts ARCH=arm64
builds:
  - main: cmd/distro.go
    id: distro
    binary: heir
    flags:
      - -tags=embedartifacts
    ldflags:
      - -s -w
      - -X github.com/tardigradeproj/heir/pkg/buildinfo.Version={{.Version}}
      - -X github.com/tardigradeproj/heir/pkg/buildinfo.CommitID={{.Commit}}
      - -X github.com/tardigradeproj/heir/pkg/buildinfo.BuildTime={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
      - amd64
  - main: cmd/tunnel.go
    id: tunnel
    binary: tunnel
    ldflags:
      - -s -w
      - -X github.com/tardigradeproj/heir/pkg/buildinfo.Version={{.Version}}
      - -X github.com/tardigradeproj/heir/pkg/buildinfo.CommitID={{.Commit}}
      - -X github.com/tardigradeproj/heir/pkg/buildinfo.BuildTime={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
      - amd64
  - main: cmd/main.go
    id: manager
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
      - amd64
  - main: cmd/masteragent.go
    id: masteragent
    binary: masteragent
    env:
      - CGO_ENABLED=1
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - arm64
      - amd64

archives:
  - id: heir
    formats: [tar.gz]
    ids:
      - distro
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_heir_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: masteragent
    formats: [tar.gz]
    ids:
      - masteragent
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_masteragent_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

dockers_v2:
  - id: controller-manager
    dockerfile: images/Dockerfile.controller-manager
    ids:
      - manager
    images:
      - ghcr.io/tardigradeproj/heir-controller-manager
    tags:
      - "{{ .Tag }}"
      - "{{ if or .IsSnapshot (and (not .IsNightly) (not (contains .Version \"-rc\"))) }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
  - id: tunnel
    dockerfile: images/Dockerfile.tunnel
    ids:
      - tunnel
    images:
      - ghcr.io/tardigradeproj/heir-tunnel
    tags:
      - "{{ .Tag }}"
      - "{{ if or .IsSnapshot (and (not .IsNightly) (not (contains .Version \"-rc\"))) }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
  - id: heir-base
    dockerfile: images/base/Dockerfile
    ids:
      - masteragent
    extra_files:
      - images/base/bootstrap.sh
      - artifacts/controlplane
    images:
      - ghcr.io/tardigradeproj/heir
    tags:
      - "{{ .Tag }}"
      - "{{ if or .IsSnapshot (and (not .IsNightly) (not (contains .Version \"-rc\"))) }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
#    build_args:
#      BASE_IMAGE: "ghcr.io/tardigradeproj/heir-base:{{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # your tags always carry a "-heirvX.Y.Z" suffix (e.g. v1.35.5-heirv0.0.2), so
  # semver's built-in prerelease detection ("auto") would flag every release.
  # only treat a build as a prerelease when it carries an explicit -rc marker.
  prerelease: "{{ if contains .Version \"-rc\" }}true{{ else }}false{{ end }}"
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

